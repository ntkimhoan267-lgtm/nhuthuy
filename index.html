<style>
  /* ============================================================
     TÍNH KHÔNG — Hiệu ứng khuấy mặt nước
     Mặt nước lam phủ kín. Lướt tay để khuấy, sóng tan thì
     hình lại ẩn đi. Chỉ khi khuấy hết mặt hồ mới thấy trọn vẹn.
     ============================================================ */

  :root {
    --nuoc-sau:  #1B4B63;   /* đáy hồ */
    --nuoc-lam:  #2E7A9B;   /* mặt nước */
    --nuoc-nong: #4FA3BF;   /* nước bắt sáng */
    --sen:       #F7F2E7;   /* trắng ngà cánh sen */
    --nhu:       #C9A96A;   /* nhũ vàng */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--nuoc-sau);
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #san {
    position: fixed;
    inset: 0;
    cursor: crosshair;
    touch-action: none;
  }

  /* --- Lớp 1: bức hình ẩn dưới đáy --- */
  #hinh {
    position: absolute;
    inset: 0;
    background-image: url("anh/nen-ngang.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Ảnh nền đổi theo thiết bị: màn ngang (laptop) dùng ảnh ngang,
     màn dọc (điện thoại) dùng ảnh dọc. */
  @media (orientation: portrait) {
    #hinh { background-image: url("anh/nen-doc.jpg"); }
  }

  /* --- Lớp 2: mặt nước lam (canvas) đè lên hình --- */
  #mat-nuoc {
    position: absolute;
    inset: 0;
    transition: opacity 1.4s cubic-bezier(.4, 0, .2, 1);
  }
  #mat-nuoc.tan-het { opacity: 0; pointer-events: none; }

  /* --- Lời mời --- */
  #loi-moi {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 5;
  }
  #loi-moi .chinh {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.4rem, 3.4vw, 2.4rem);
    color: var(--sen);
    letter-spacing: .02em;
    text-shadow: 0 2px 24px rgba(0,0,0,.4);
  }
  #loi-moi .phu {
    margin-top: .9rem;
    font-size: clamp(.68rem, 1.3vw, .8rem);
    font-weight: 300;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(247,242,231,.55);
  }
  #loi-moi.an { opacity: 0; }

  /* --- Vạch nước: tiến độ khuấy --- */
  #vach {
    position: absolute;
    left: 50%;
    bottom: 2.6rem;
    transform: translateX(-50%);
    width: min(280px, 54vw);
    z-index: 5;
    opacity: 0;
    transition: opacity .8s ease;
    pointer-events: none;
  }
  #vach.hien { opacity: 1; }
  #vach .ray {
    height: 1px;
    background: rgba(247,242,231,.18);
    position: relative;
    overflow: hidden;
  }
  #vach .day {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, transparent, var(--nhu));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  #vach .so {
    margin-top: .75rem;
    text-align: center;
    font-size: .6rem;
    font-weight: 300;
    letter-spacing: .3em;
    color: rgba(247,242,231,.4);
    font-variant-numeric: tabular-nums;
  }

  /* --- Cửa: nút mời tham gia --- */
  #cua {
    position: absolute;
    left: 50%;
    bottom: 3.4rem;
    transform: translate(-50%, 28px);
    z-index: 10;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.1s ease .7s, transform 1.1s cubic-bezier(.2,.8,.3,1) .7s;
    text-align: center;
  }
  #cua.mo {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }
  #cua .cau {
    display: block;
    margin-bottom: 1.1rem;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--sen);
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
  }
  #nut {
    display: inline-flex;
    align-items: center;
    gap: .75rem;
    padding: 1rem 2.4rem;
    border-radius: 999px;
    background: rgba(247,242,231,.94);
    color: #1B3A2E;
    text-decoration: none;
    font-size: .8rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    box-shadow: 0 10px 44px rgba(0,0,0,.4), 0 0 0 1px rgba(201,169,106,.5) inset;
    transition: transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s ease, background .35s ease;
    backdrop-filter: blur(6px);
  }
  #nut:hover, #nut:focus-visible {
    transform: translateY(-3px) scale(1.03);
    background: #fff;
    box-shadow: 0 16px 56px rgba(0,0,0,.5), 0 0 0 1px var(--nhu) inset;
  }
  #nut:focus-visible { outline: 2px solid var(--nhu); outline-offset: 5px; }
  #nut .sen-nho {
    width: 14px; height: 14px;
    opacity: .65;
    flex-shrink: 0;
  }

  /* --- Tôn trọng người dùng tắt hiệu ứng chuyển động --- */
  @media (prefers-reduced-motion: reduce) {
    #mat-nuoc, #cua, #nut, #loi-moi, #vach .day { transition-duration: .01ms !important; }
  }

  @media (max-width: 640px) {
    #cua { bottom: 2.4rem; }
    #nut { padding: .85rem 1.8rem; font-size: .72rem; }
    #vach { bottom: 1.8rem; }
  }

  /* --- Mật thư: lớp phủ hiện ảnh với hiệu ứng "hô biến" --- */
  #matthu {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 3vmin;
    background: rgba(8, 26, 36, 0);
    backdrop-filter: blur(0);
    -webkit-backdrop-filter: blur(0);
    transition: background .6s ease, backdrop-filter .6s ease;
  }
  #matthu.mo {
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: rgba(8, 26, 36, .93);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #matthu-bando { display: block; cursor: pointer; }
  .matthu-chi-dan {
    margin: 0;
    text-align: center;
    color: rgba(247,242,231,.82);
    font-size: .92rem;
    letter-spacing: .02em;
    opacity: 0;
    transition: opacity .4s ease .55s;
  }
  #matthu.mo .matthu-chi-dan { opacity: 1; }
  #matthu-khung {
    margin: 0;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(201,169,106,.55), 0 0 70px rgba(201,169,106,.22);
  }
  #matthu-khung img {
    display: block;
    max-width: 94vw;
    max-height: 82vh;
    width: auto;
    height: auto;
  }
  /* Ảnh hiện dần: từ nhỏ, mờ, sáng loá → rõ nét */
  #matthu.mo #matthu-khung { animation: hoBien 1s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes hoBien {
    0%   { opacity: 0; transform: scale(.72) rotate(-3deg); filter: blur(16px) brightness(1.9); }
    55%  { opacity: 1; filter: blur(0) brightness(1.15); }
    100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0) brightness(1); }
  }
  /* Luồng sáng vàng quét qua lúc hiện */
  #matthu.mo #matthu-khung::after {
    content: "";
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(247,242,231,.5) 48%, rgba(201,169,106,.38) 52%, transparent 70%);
    transform: translateX(-120%);
    animation: quetSang 1.1s ease .15s both;
  }
  @keyframes quetSang { to { transform: translateX(120%); } }
  /* Vầng sáng vàng loé ra rồi tan */
  #matthu.mo #matthu-khung::before {
    content: "";
    position: absolute; inset: -40%; z-index: 1; pointer-events: none;
    background: radial-gradient(circle, rgba(201,169,106,.55) 0%, transparent 60%);
    opacity: 0;
    animation: loeSang 1s ease both;
  }
  @keyframes loeSang { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.25); } }
  #matthu-dong {
    position: absolute;
    top: max(12px, env(safe-area-inset-top, 0px)); right: 16px; z-index: 3;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(247,242,231,.4);
    background: rgba(8,26,36,.5);
    color: var(--sen); font-size: 1.7rem; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; transition: opacity .4s ease .55s, background .25s, transform .25s;
  }
  #matthu.mo #matthu-dong { opacity: 1; }
  #matthu-dong:hover, #matthu-dong:focus-visible { background: rgba(201,169,106,.4); transform: scale(1.08); }
  #matthu-dong:focus-visible { outline: 2px solid var(--nhu); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    #matthu, #matthu.mo #matthu-khung, #matthu-dong { transition-duration: .01ms !important; }
    #matthu.mo #matthu-khung, #matthu.mo #matthu-khung::after, #matthu.mo #matthu-khung::before { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="san">
  <div id="hinh"></div>
  <canvas id="mat-nuoc"></canvas>

  <div id="loi-moi">
    <div class="chinh">Mặt hồ đang lặng.<br>Khuấy tay lên để thấy.</div>
    <div class="phu">Lướt để khuấy</div>
  </div>

  <div id="vach">
    <div class="ray"><div class="day" id="day-nuoc"></div></div>
    <div class="so" id="so-phan-tram">0%</div>
  </div>

  <div id="cua">
    <span class="cau">Mọi hành trình đều bắt đầu từ một điểm hẹn. Dấu hiệu đầu tiên đang chờ bạn.</span>
    <a id="nut" href="#" rel="noopener noreferrer">
      <svg class="sen-nho" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2c1.6 2.4 2.4 4.6 2.4 6.6 0 1-.2 1.9-.6 2.8 1.4-1.6 3.2-2.6 5.4-3-.2 3-1.4 5.4-3.4 7.2 1.6-.4 3.2-.4 4.8 0-2 3.2-5.2 5-8.6 5.4-3.4-.4-6.6-2.2-8.6-5.4 1.6-.4 3.2-.4 4.8 0-2-1.8-3.2-4.2-3.4-7.2 2.2.4 4 1.4 5.4 3-.4-.9-.6-1.8-.6-2.8C9.6 6.6 10.4 4.4 12 2z"/>
      </svg>
      <span id="chu-nut">Nhận dấu hiệu</span>
    </a>
  </div>
</div>

<!-- Mật thư: hiện ra với hiệu ứng "hô biến" khi bấm nút.
     Ảnh dọc cho điện thoại (màn dọc), ảnh ngang cho máy tính. -->
<div id="matthu" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Mật thư">
  <button id="matthu-dong" type="button" aria-label="Đóng mật thư">&times;</button>
  <figure id="matthu-khung">
    <a id="matthu-bando" href="#" target="_blank" rel="noopener noreferrer" aria-label="Mở Google Maps chỉ đường đến điểm tập trung">
      <picture>
        <source media="(orientation: portrait)" srcset="anh/matthu-doc.jpg">
        <img src="anh/matthu-ngang.jpg" alt="Mật thư: chỉ dẫn điểm hẹn cho chặng tiếp theo">
      </picture>
    </a>
  </figure>
  <p class="matthu-chi-dan">Bấm vào ảnh để mở chỉ đường trên Google Maps</p>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   BẢNG ĐIỀU CHỈNH — sửa ở đây, không cần đụng vào code dưới
   ══════════════════════════════════════════════════════════ */

const CAI_DAT = {

  // ── Chữ trên nút (bấm nút để "hô biến" hiện tấm mật thư)
  CTA_TEXT: 'Nhận dấu hiệu',

  // ── Link Google Maps mở ra khi bấm vào tấm mật thư (điểm tập trung)
  BAN_DO_URL: 'https://maps.app.goo.gl/scRVrJKZu6SwMDw99?g_st=iz',

  // ── Câu dẫn phía trên nút
  CTA_CAU: 'Mọi hành trình đều bắt đầu từ một điểm hẹn. Dấu hiệu đầu tiên đang chờ bạn.',

  // ── Vòng đời một gợn sóng (mili-giây). Lớn hơn = sóng lâu tan hơn.
  RIPPLE_LIFETIME: 800,

  // ── Bán kính sóng lúc mới sinh và lúc nở hết (pixel)
  RIPPLE_START_RADIUS: 60,
  RIPPLE_MAX_RADIUS: 80,

  // ── Chuột phải dịch bao nhiêu px mới sinh sóng mới (chống rung tay)
  MIN_MOVE_DISTANCE: 15,

  // ── Khuấy được bao nhiêu phần mặt hồ thì mở cửa (0.75 = 75%)
  REVEAL_THRESHOLD: 0.9,

  // ── Lưới đếm tiến độ (ẩn, không nhìn thấy)
  LUOI_COT: 20,
  LUOI_HANG: 12,
};

/* ══════════════════════════════════════════════════════════
   TỪ ĐÂY TRỞ XUỐNG LÀ PHẦN CHẠY MÁY
   ══════════════════════════════════════════════════════════ */

const san      = document.getElementById('san');
const canvas   = document.getElementById('mat-nuoc');
const ctx      = canvas.getContext('2d');
const loiMoi   = document.getElementById('loi-moi');
const vach     = document.getElementById('vach');
const dayNuoc  = document.getElementById('day-nuoc');
const soPhanTram = document.getElementById('so-phan-tram');
const cua      = document.getElementById('cua');
const nut      = document.getElementById('nut');

// Gắn chữ từ bảng điều chỉnh
document.getElementById('chu-nut').textContent = CAI_DAT.CTA_TEXT;
document.querySelector('#cua .cau').textContent = CAI_DAT.CTA_CAU;

// Bấm nút không chuyển trang nữa — "hô biến" hiện tấm mật thư
const matThu     = document.getElementById('matthu');
const dongMatThu = document.getElementById('matthu-dong');
document.getElementById('matthu-bando').href = CAI_DAT.BAN_DO_URL;  // bấm ảnh → mở Google Maps
function moMatThu(e){
  if (e) e.preventDefault();
  matThu.classList.add('mo');
  matThu.setAttribute('aria-hidden', 'false');
  dongMatThu.focus();
}
function dongMatThuLai(){
  matThu.classList.remove('mo');
  matThu.setAttribute('aria-hidden', 'true');
  nut.focus();
}
nut.addEventListener('click', moMatThu);
dongMatThu.addEventListener('click', dongMatThuLai);
matThu.addEventListener('click', e => { if (e.target === matThu) dongMatThuLai(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && matThu.classList.contains('mo')) dongMatThuLai(); });

let W = 0, H = 0, dpr = 1;
const song = [];              // danh sách gợn sóng đang sống
let daKhuay = null;           // lưới đánh dấu ô đã khuấy
let soODaKhuay = 0;
let tongO = 0;
let xong = false;             // đã khuấy đủ chưa
let daChamVao = false;        // người dùng đã tương tác lần đầu chưa
let xTruoc = null, yTruoc = null;

/* ── Dựng lại canvas theo kích thước màn hình ── */
function dungCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ── Dựng lưới đếm tiến độ ── */
function dungLuoi() {
  tongO = CAI_DAT.LUOI_COT * CAI_DAT.LUOI_HANG;
  daKhuay = new Uint8Array(tongO);
  soODaKhuay = 0;
}

/* ── Vẽ mặt nước lam phủ kín ──
   Không phải màu phẳng: có chiều sâu, sáng hơn ở giữa,
   sẫm dần về rìa — như nhìn xuống một hồ nước thật. */
function veMatNuoc() {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.78);
  g.addColorStop(0,   '#4FA3BF');
  g.addColorStop(0.45,'#2E7A9B');
  g.addColorStop(1,   '#12384B');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ── Hàm nới (easing) ── */
const easeOutQuad = t => t * (2 - t);      // bán kính nở: nhanh rồi chậm
const easeInQuad  = t => t * t;            // độ đậm tan: chậm rồi nhanh

/* ── Sinh một gợn sóng mới tại (x, y) ── */
function sinhSong(x, y) {
  song.push({ x, y, sinh: performance.now() });
  danhDauLuoi(x, y);
}

/* ── Đánh dấu các ô lưới mà gợn sóng quét qua ── */
function danhDauLuoi(x, y) {
  const rongO = W / CAI_DAT.LUOI_COT;
  const caoO  = H / CAI_DAT.LUOI_HANG;
  const R     = CAI_DAT.RIPPLE_MAX_RADIUS * 0.6;   // vùng tính là "đã khuấy"

  const cotDau  = Math.max(0, Math.floor((x - R) / rongO));
  const cotCuoi = Math.min(CAI_DAT.LUOI_COT - 1, Math.floor((x + R) / rongO));
  const hangDau = Math.max(0, Math.floor((y - R) / caoO));
  const hangCuoi= Math.min(CAI_DAT.LUOI_HANG - 1, Math.floor((y + R) / caoO));

  for (let h = hangDau; h <= hangCuoi; h++) {
    for (let c = cotDau; c <= cotCuoi; c++) {
      const tamX = (c + 0.5) * rongO;
      const tamY = (h + 0.5) * caoO;
      if ((tamX - x) ** 2 + (tamY - y) ** 2 <= R * R) {
        const i = h * CAI_DAT.LUOI_COT + c;
        if (!daKhuay[i]) { daKhuay[i] = 1; soODaKhuay++; }
      }
    }
  }
  capNhatVach();
}

/* ── Cập nhật vạch tiến độ ── */
function capNhatVach() {
  if (xong) return;
  const ty = soODaKhuay / tongO;
  dayNuoc.style.width = Math.min(100, (ty / CAI_DAT.REVEAL_THRESHOLD) * 100) + '%';
  soPhanTram.textContent = Math.min(100, Math.round((ty / CAI_DAT.REVEAL_THRESHOLD) * 100)) + '%';
  if (ty >= CAI_DAT.REVEAL_THRESHOLD) moCua();
}

/* ── Khuấy đủ → mặt nước tan, hình hiện trọn, cửa mở ── */
function moCua() {
  if (xong) return;
  xong = true;
  canvas.classList.add('tan-het');
  loiMoi.classList.add('an');
  vach.classList.remove('hien');
  san.style.cursor = 'default';
  setTimeout(() => cua.classList.add('mo'), 500);
}

/* ── Vòng lặp vẽ: MỖI FRAME XOÁ SẠCH rồi vẽ lại từ đầu.
   Đây là điểm mấu chốt — không vẽ tích lũy, nên sóng tan
   là chỗ đó trở về lam thật sự, không để lại vệt. ── */
function ve(now) {
  requestAnimationFrame(ve);
  if (xong) return;

  // 1. Xoá sạch, vẽ lại mặt nước nguyên vẹn
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  veMatNuoc();

  // 2. Khoét thủng mặt nước tại từng gợn sóng đang sống
  ctx.globalCompositeOperation = 'destination-out';

  for (let i = song.length - 1; i >= 0; i--) {
    const s = song[i];
    const t = (now - s.sinh) / CAI_DAT.RIPPLE_LIFETIME;   // tuổi 0 → 1

    if (t >= 1) { song.splice(i, 1); continue; }          // hết đời, xoá

    const r = CAI_DAT.RIPPLE_START_RADIUS
            + (CAI_DAT.RIPPLE_MAX_RADIUS - CAI_DAT.RIPPLE_START_RADIUS) * easeOutQuad(t);
    const alpha = 1 - easeInQuad(t);                      // đậm → tan

    // Lõi sóng: tâm đặc, mép mờ dần
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0,    `rgba(0,0,0,${alpha})`);
    g.addColorStop(0.42, `rgba(0,0,0,${alpha * 0.92})`);
    g.addColorStop(0.72, `rgba(0,0,0,${alpha * 0.42})`);
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Vòng đồng tâm thứ hai: gợn nước lan ra ngoài, mảnh hơn
    const r2 = r * 1.28;
    const a2 = alpha * 0.3;
    if (a2 > 0.01) {
      const g2 = ctx.createRadialGradient(s.x, s.y, r * 0.92, s.x, s.y, r2);
      g2.addColorStop(0, 'rgba(0,0,0,0)');
      g2.addColorStop(0.4, `rgba(0,0,0,${a2})`);
      g2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* ── Bắt chuyển động của tay ──
   Chỉ cần lướt, KHÔNG cần nhấn giữ.
   Đứng yên → không sinh sóng mới → sóng cuối tan hết → lam sạch. ── */
function khuay(x, y) {
  if (xong) return;

  if (!daChamVao) {
    daChamVao = true;
    loiMoi.classList.add('an');
    vach.classList.add('hien');
  }

  if (xTruoc !== null) {
    const dx = x - xTruoc, dy = y - yTruoc;
    if (dx * dx + dy * dy < CAI_DAT.MIN_MOVE_DISTANCE ** 2) return;  // chưa đủ xa
  }
  xTruoc = x; yTruoc = y;
  sinhSong(x, y);
}

san.addEventListener('mousemove', e => khuay(e.clientX, e.clientY));

san.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  khuay(t.clientX, t.clientY);
}, { passive: false });

san.addEventListener('touchstart', e => {
  const t = e.touches[0];
  xTruoc = t.clientX; yTruoc = t.clientY;
  khuay(t.clientX, t.clientY);
}, { passive: true });

window.addEventListener('resize', () => {
  dungCanvas();
  dungLuoi();
  song.length = 0;
  capNhatVach();
});

/* ── Khởi động ── */
dungCanvas();
dungLuoi();
requestAnimationFrame(ve);
</script>
