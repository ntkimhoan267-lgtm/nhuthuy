      const fCtx = fxCanvas.getContext('2d');

      const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const state = {
        phase: 'BURNING', // 'BURNING' | 'DOUSING' | 'REVEALING' | 'SOLVED'
        startTime: performance.now(),
        lastFrameTime: performance.now(),
        emberCreep: 0,
        fireIntensity: 1.0,
        fireFlareBoost: 0.0,
        shakeAmount: 0.0,
        wetness: 0.0,
        revealProgress: 0.0, // Tiến độ mở cuộn mật thư từ 0 -> 1
        hintOpacity: 1.0,
        douseStartTime: 0,
        revealStartTime: 0,
        animationRunning: true,

        strokes: [],
        activeStroke: null,
        evalTimer: null,
        waitSecondTimer: null,
        strokeEvaporating: false,
        strokeEvaporateProgress: 0,
        strokeGlowingSuccess: false,

        zoom: 1
      };

      // Tải hình mật thư (ưu tiên link Quản trò điền, mặc định dùng ảnh mật thư "Khóa: KIM TỰ THÁP" nhúng sẵn)
      const cipherImages = {
        portrait: { img: null, loaded: false, width: BANG_DIEU_CHINH.kichThuocMacDinhDoc.rong, height: BANG_DIEU_CHINH.kichThuocMacDinhDoc.cao },
        landscape: { img: null, loaded: false, width: BANG_DIEU_CHINH.kichThuocMacDinhNgang.rong, height: BANG_DIEU_CHINH.kichThuocMacDinhNgang.cao }
      };

      const portraitSrc = (BANG_DIEU_CHINH.hinhMatThuDoc && BANG_DIEU_CHINH.hinhMatThuDoc.trim())
        ? BANG_DIEU_CHINH.hinhMatThuDoc.trim()
        : HINH_MAT_THU_NHUNG_SAN;
      const landscapeSrc = (BANG_DIEU_CHINH.hinhMatThuNgang && BANG_DIEU_CHINH.hinhMatThuNgang.trim())
        ? BANG_DIEU_CHINH.hinhMatThuNgang.trim()
        : HINH_MAT_THU_NHUNG_SAN;

      scrollCipherImg.src = portraitSrc;

      function loadCipherImage(url, slot) {
        if (!url) return;
        const img = new Image();
        img.onload = () => {
          slot.img = img;
          slot.loaded = true;
          rebuildLayoutAndPaper();
        };
        img.src = url;
      }

      loadCipherImage(portraitSrc, cipherImages.portrait);
      loadCipherImage(landscapeSrc, cipherImages.landscape);

      function updateAudioButtonUI() {
        audioBtn.textContent = SoundEngine.isEnabled() ? '🔊' : '🔇';
      }
      updateAudioButtonUI();
      bottomGuide.textContent = BANG_DIEU_CHINH.dongHuongDanBanDau;

      let toastTimer = null;
      function showToast(text, isSuccess = false, durationMs = 2800) {
        if (toastTimer) clearTimeout(toastTimer);
        toastBanner.textContent = text;
        toastBanner.classList.toggle('water-success', isSuccess);
        toastBanner.classList.add('visible');
        toastTimer = setTimeout(() => {
          toastBanner.classList.remove('visible');
        }, durationMs);
      }

      /* ========================================================================
       * THIẾT KẾ HÌNH HỌC TỜ GIẤY DA CŨ & VÙNG CHÁY SÉM MƯỢT KHÔNG PHÂN BẬC
       * ======================================================================== */
      const layout = {
        vw: window.innerWidth,
        vh: window.innerHeight,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        isPortrait: window.innerHeight >= window.innerWidth,
        paperX: 0,
        paperY: 0,
        paperW: 300,
        paperH: 500,
        bufW: 360,
        bufH: 600,
        fireBufW: 240,
        fireBufH: 360
      };

      let paperRenderCanvas = document.createElement('canvas');
      let paperCompositeCanvas = document.createElement('canvas');
      let fireVolumetricCanvas = document.createElement('canvas');
      // Hai bản lửa đã làm mờ sẵn ở kích thước nhỏ (xem renderSingleFrame)
      const fireBlurNho = document.createElement('canvas');
      const fireBlurLon = document.createElement('canvas');

      let paperFieldData = null;
      let bottomEdgeVByU = null;
      let leftEdgeUByV = null;
      let rightEdgeUByV = null;
      let allBurnPerimeter = [];

      function smin(a, b, k) {
        const h = Math.max(k - Math.abs(a - b), 0.0) / k;
        return Math.min(a, b) - h * h * k * 0.25;
      }

      function evalPaperBurnField(u, v, aspect) {
        const scaleX = Math.min(1.0, aspect);
        const scaleY = Math.min(1.0, 1.0 / aspect);

        const topWave = 0.005 * (Noise2D.perlin(u * 4.5 + 1.2, 0.5) * 0.6 + Noise2D.perlin(u * 10.0 + 3.4, 1.2) * 0.4);
        const dTop = (v - (0.028 + topWave)) * scaleY;

        const leftUpperWave = 0.005 * Noise2D.perlin(0.3, v * 5.0 + 2.1);
        const leftFireMask = Math.pow(Math.max(0, Math.min(1, (v - 0.36) / 0.60)), 1.35);
        const leftScallop = (
          0.45 * (Noise2D.perlin(1.7, v * 4.2 + 0.8) * 0.5 + 0.5) +
          0.35 * (Noise2D.perlin(4.3, v * 8.5 + 2.6) * 0.5 + 0.5) +
          0.20 * Math.sin(v * 15.0 + 1.1) * 0.5
        );
        const leftBite1 = Math.exp(-Math.pow((v - 0.58) / 0.085, 2)) * 0.046;
        const leftBite2 = Math.exp(-Math.pow((v - 0.81) / 0.095, 2)) * 0.064;
        const leftErosion = 0.032 + leftUpperWave + leftFireMask * (0.015 + 0.062 * leftScallop) + leftBite1 + leftBite2;
        const dLeft = (u - leftErosion) * scaleX;

        const rightUpperWave = 0.005 * Noise2D.perlin(8.7, v * 5.0 + 6.1);
        const rightFireMask = Math.pow(Math.max(0, Math.min(1, (v - 0.34) / 0.62)), 1.35);
        const rightScallop = (
          0.48 * (Noise2D.perlin(6.1, v * 4.0 + 3.9) * 0.5 + 0.5) +
          0.32 * (Noise2D.perlin(9.4, v * 8.2 + 5.1) * 0.5 + 0.5) +
          0.20 * Math.cos(v * 14.0 + 2.4) * 0.5
        );
        const rightBite1 = Math.exp(-Math.pow((v - 0.53) / 0.080, 2)) * 0.042;
        const rightBite2 = Math.exp(-Math.pow((v - 0.74) / 0.090, 2)) * 0.062;
        const rightBite3 = Math.exp(-Math.pow((v - 0.90) / 0.075, 2)) * 0.048;
        const rightErosion = 0.032 + rightUpperWave + rightFireMask * (0.015 + 0.062 * rightScallop) + rightBite1 + rightBite2 + rightBite3;
        const dRight = ((1.0 - rightErosion) - u) * scaleX;

        const bottomScallop = (
          0.50 * (Noise2D.perlin(u * 3.8 + 2.2, 7.5) * 0.5 + 0.5) +
          0.35 * (Noise2D.perlin(u * 7.6 + 5.4, 3.1) * 0.5 + 0.5) +
          0.15 * Math.sin(u * 13.5 + 0.7) * 0.5
        );
        const botBiteLeft = Math.exp(-Math.pow((u - 0.27) / 0.12, 2)) * 0.050;
        const botBiteMidRight = Math.exp(-Math.pow((u - 0.68) / 0.13, 2)) * 0.060;
        const botLobeCenter = -Math.exp(-Math.pow((u - 0.47) / 0.09, 2)) * 0.020;
        const bottomErosion = 0.052 + 0.052 * bottomScallop + botBiteLeft + botBiteMidRight + botLobeCenter;
        const dBottom = ((1.0 - bottomErosion) - v) * scaleY;

        const topCorners = smin(dTop, Math.min(dLeft, dRight), 0.036);
        const sideWalls = Math.min(dLeft, dRight);
        const bottomAndSides = smin(dBottom, sideWalls, 0.075);
        const dist = Math.min(topCorners, bottomAndSides);

        const vBurn = Math.max(0, Math.min(1, (v - 0.30) / 0.56));
        const smoothVBurn = vBurn * vBurn * (3 - 2 * vBurn);
        const bottomBoost = Math.pow(Math.max(0, (v - 0.65) / 0.35), 1.2) * 0.50;
        const burnActivity = Math.min(1.3, smoothVBurn + bottomBoost);

        const scorchPlume = Noise2D.fbm(u * 4.2 + 1.9, v * 2.2 - 4.2, 3, 2.0, 0.55) * 0.5 + 0.5;
        const scorchDetail = Noise2D.perlin(u * 10.5 + 3.7, v * 6.0 + 1.1) * 0.5 + 0.5;
        const charWidth = 0.002 + burnActivity * (0.032 + 0.095 * Math.pow(scorchPlume, 1.2) + 0.028 * scorchDetail);

        const safeX = Math.max(0, Math.abs(u - 0.5) - 0.30) / 0.20;
        const safeY = Math.max(0, Math.abs(v - 0.42) - 0.28) / 0.22;
        const safeFactor = Math.min(1, Math.hypot(safeX, safeY));
        const creepScale = burnActivity * safeFactor * (0.010 + 0.014 * scorchPlume);

        return {
          dist,
          charWidth,
          creepScale,
          burnActivity
        };
      }

      function buildPaperBuffers() {
        const bw = layout.bufW;
        const bh = layout.bufH;
        const aspect = bw / bh;

        paperRenderCanvas.width = bw;
        paperRenderCanvas.height = bh;
        paperCompositeCanvas.width = bw;
        paperCompositeCanvas.height = bh;
        fireVolumetricCanvas.width = layout.fireBufW;
        fireVolumetricCanvas.height = layout.fireBufH;

        const stride = 7;
        paperFieldData = new Float32Array(bw * bh * stride);

        for (let y = 0; y < bh; y++) {
          const v = y / (bh - 1);
          for (let x = 0; x < bw; x++) {
            const u = x / (bw - 1);
            const idx = (y * bw + x) * stride;

            const f = evalPaperBurnField(u, v, aspect);

            const stainLarge = Noise2D.fbm(u * 3.0 + 0.7, v * 3.0 + 2.3, 4, 2.0, 0.52);
            const stainMed = Noise2D.fbm(u * 8.5 + 5.1, v * 8.5 + 1.4, 3, 2.1, 0.5);
            const fiberH = Noise2D.perlin(u * 52.0, v * 10.5) * 0.55 + Noise2D.perlin(u * 12.0, v * 46.0) * 0.45;
            const fineGrain = ((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1 + 1) % 1 - 0.5;

            const ageSpot1 = Math.exp(-Math.pow((u - 0.27) / 0.16, 2) - Math.pow((v - 0.28) / 0.14, 2)) * 0.085;
            const ageSpot2 = Math.exp(-Math.pow((u - 0.72) / 0.18, 2) - Math.pow((v - 0.58) / 0.15, 2)) * 0.075;
            const ageRing = Math.exp(-Math.pow((Math.hypot(u - 0.32, v - 0.34) - 0.13) / 0.022, 2)) * 0.065;

            let curlShade = 0;
            if (f.dist > 0 && f.dist < 0.026) {
              const tCurl = f.dist / 0.026;
              curlShade = Math.sin(tCurl * Math.PI) * 0.04 - Math.pow(1 - tCurl, 2) * 0.075;
            }

            const tone = 0.88 + stainLarge * 0.12 + stainMed * 0.065 + fiberH * 0.032 + fineGrain * 0.020 - ageSpot1 - ageSpot2 - ageRing + curlShade;

            const pr = Math.max(130, Math.min(242, 226 * tone));
            const pg = Math.max(92, Math.min(206, 184 * tone - (ageSpot1 + ageRing) * 26));
            const pb = Math.max(48, Math.min(150, 120 * tone - (ageSpot1 + ageRing) * 34));

            paperFieldData[idx + 0] = f.dist;
            paperFieldData[idx + 1] = f.charWidth;
            paperFieldData[idx + 2] = f.creepScale;
            paperFieldData[idx + 3] = pr;
            paperFieldData[idx + 4] = pg;
            paperFieldData[idx + 5] = pb;
            paperFieldData[idx + 6] = f.burnActivity;
          }
        }

        computeBurnContoursForFire();
        updatePaperDynamicSurface(0);
      }

      function computeBurnContoursForFire() {
        const fw = layout.fireBufW;
        const fh = layout.fireBufH;
        const bw = layout.bufW;
        const bh = layout.bufH;
        const stride = 7;

        bottomEdgeVByU = new Float32Array(fw);
        leftEdgeUByV = new Float32Array(fh);
        rightEdgeUByV = new Float32Array(fh);
        allBurnPerimeter = [];

        let firstValidFx = -1, lastValidFx = -1;
        for (let fx = 0; fx < fw; fx++) {
          const u = fx / (fw - 1);
          const bx = Math.min(bw - 1, Math.max(0, Math.round(u * (bw - 1))));
          let foundV = -1;
          for (let by = bh - 2; by >= Math.floor(bh * 0.55); by--) {
            const d = paperFieldData[(by * bw + bx) * stride + 0];
            if (d > 0) {
              foundV = by / (bh - 1);
              break;
            }
          }
          bottomEdgeVByU[fx] = foundV;
          if (foundV > 0) {
            if (firstValidFx === -1) firstValidFx = fx;
            lastValidFx = fx;
            if (fx % 4 === 0) allBurnPerimeter.push({ u, v: foundV });
          }
        }
        if (firstValidFx > 0) {
          for (let fx = 0; fx < firstValidFx; fx++) bottomEdgeVByU[fx] = bottomEdgeVByU[firstValidFx];
        }
        if (lastValidFx > 0 && lastValidFx < fw - 1) {
          for (let fx = lastValidFx + 1; fx < fw; fx++) bottomEdgeVByU[fx] = bottomEdgeVByU[lastValidFx];
        }

        for (let fy = 0; fy < fh; fy++) {
          const v = fy / (fh - 1);
          const by = Math.min(bh - 1, Math.max(0, Math.round(v * (bh - 1))));
          let leftU = -1;
          for (let bx = 1; bx < Math.floor(bw * 0.48); bx++) {
            if (paperFieldData[(by * bw + bx) * stride + 0] > 0) {
              leftU = bx / (bw - 1);
              break;
            }
          }
          leftEdgeUByV[fy] = leftU;

          let rightU = -1;
          for (let bx = bw - 2; bx > Math.floor(bw * 0.52); bx--) {
            if (paperFieldData[(by * bw + bx) * stride + 0] > 0) {
              rightU = bx / (bw - 1);
              break;
            }
          }
          rightEdgeUByV[fy] = rightU;

          if (v > 0.44 && v < 0.90 && fy % 6 === 0) {
            if (leftU > 0) allBurnPerimeter.push({ u: leftU, v });
            if (rightU > 0) allBurnPerimeter.push({ u: rightU, v });
          }
        }
      }

      let lastPaperUpdateMs = -1000;
      function updatePaperDynamicSurface(nowSec) {
        const bw = layout.bufW;
        const bh = layout.bufH;
        const pCtx = paperRenderCanvas.getContext('2d');
        const imgData = pCtx.createImageData(bw, bh);
        const out = imgData.data;
        const stride = 7;

        const creep = state.emberCreep;
        const fireInt = state.fireIntensity * (1 + state.fireFlareBoost * 0.55);
        const wet = state.wetness;
        const invBw = 1 / (bw - 1);
        const invBh = 1 / (bh - 1);

        const aaWidth = 1.2 * Math.max(invBw, invBh);

        for (let y = 0; y < bh; y++) {
          const v = y * invBh;
          for (let x = 0; x < bw; x++) {
            const u = x * invBw;
            const idx = (y * bw + x) * stride;
            const outIdx = (y * bw + x) * 4;

            const d = paperFieldData[idx + 0] - creep * paperFieldData[idx + 2];
            if (d <= -aaWidth) {
              out[outIdx + 3] = 0;
              continue;
            }

            let alpha = 1.0;
            if (d < aaWidth) {
              const t = (d + aaWidth) / (2 * aaWidth);
              alpha = t * t * (3 - 2 * t);
            }

            const charW = paperFieldData[idx + 1];
            const burnAct = paperFieldData[idx + 6];
            let r = paperFieldData[idx + 3];
            let g = paperFieldData[idx + 4];
            let b = paperFieldData[idx + 5];

            const effectiveD = Math.max(0, d);

            if (effectiveD < charW && burnAct > 0.01) {
              const tNorm = effectiveD / charW;
              const s = tNorm * tNorm * (3 - 2 * tNorm);
              const p1 = Math.pow(tNorm, 0.55);
              const p2 = Math.pow(tNorm, 1.20);

              const scorchR = 12 * (1 - p1) + (72 * (1 - s) + r * s) * p1;
              const scorchG = 5 * (1 - p1) + (32 * (1 - p2) + g * p2) * p1;
              const scorchB = 2 * (1 - p1) + (10 * (1 - p2) + b * p2) * p1;

              const weight = Math.min(1.0, burnAct * 1.2) * (1.0 - s * s);
              r = r * (1 - weight) + scorchR * weight;
              g = g * (1 - weight) + scorchG * weight;
              b = b * (1 - weight) + scorchB * weight;
            }

            const emberWidth = 0.0065 + 0.0050 * Math.min(1, burnAct);
            if (effectiveD < emberWidth && burnAct > 0.08 && fireInt > 0.02) {
              const rimT = 1.0 - (effectiveD / emberWidth);
              const rimProfile = Math.pow(rimT, 1.25);

              const nCoal1 = Noise2D.perlin(u * 24.0 + nowSec * 1.8, v * 24.0 - nowSec * 1.3);
              const nCoal2 = Noise2D.perlin(u * 54.0 - nowSec * 3.2, v * 54.0 + nowSec * 2.7);
              const coalPatch = Math.max(0, nCoal1 * 0.65 + nCoal2 * 0.35 + 0.42);

              const emberGlow = rimProfile * coalPatch * Math.min(1.4, burnAct * 1.55) * fireInt;
              if (emberGlow > 0.03) {
                const eg = Math.min(1.5, emberGlow);
                r = Math.min(255, r + eg * 250);
                g = Math.min(255, g + Math.pow(eg, 1.50) * 148);
                b = Math.min(255, b + Math.pow(eg, 2.4) * 46);
              }
            }

            if (wet > 0.001) {
              const wetDarken = 1.0 - wet * 0.18;
              const sheen = Math.max(0, Noise2D.perlin(u * 5.0 + 1.1, v * 5.0 + 0.7) + 0.25)
                * Math.exp(-Math.pow((u * 0.65 + v * 0.55 - 0.56) / 0.26, 2)) * wet * 28;

              r = r * wetDarken + sheen * 0.92;
              g = g * wetDarken + sheen * 1.02;
              b = b * (wetDarken + wet * 0.04) + sheen * 1.16;
            }

            out[outIdx + 0] = Math.max(0, Math.min(255, r));
            out[outIdx + 1] = Math.max(0, Math.min(255, g));
            out[outIdx + 2] = Math.max(0, Math.min(255, b));
            out[outIdx + 3] = Math.round(alpha * 255);
          }
        }

        pCtx.putImageData(imgData, 0, 0);
      }

      /* ========================================================================
       * 5. BỘ KẾT XUẤT LƯỠI LỬA VOLUMETRIC PERLIN/SIMPLEX FBM (60FPS PIXEL SHADER)
       * ======================================================================== */
      function renderVolumetricFireField(nowSec, intensity) {
        const fw = layout.fireBufW;
        const fh = layout.fireBufH;
        const vCtx = fireVolumetricCanvas.getContext('2d');

        if (intensity <= 0.01 || !bottomEdgeVByU) {
          vCtx.clearRect(0, 0, fw, fh);
          return;
        }

        const imgData = vCtx.createImageData(fw, fh);
        const data = imgData.data;

        const boost = 1 + state.fireFlareBoost * 0.65;
        const effInt = intensity * boost;
        const invFw = 1 / (fw - 1);
        const invFh = 1 / (fh - 1);
        const startY = Math.floor(fh * 0.26);

        for (let fy = startY; fy < fh; fy++) {
          const v = fy * invFh;
          const leftEdgeU = leftEdgeUByV[fy];
          const rightEdgeU = rightEdgeUByV[fy];

          for (let fx = 0; fx < fw; fx++) {
            const u = fx * invFw;
            let heat = 0.0;

            const warp1 = Noise2D.perlin(u * 5.5 + 0.7, v * 4.8 + nowSec * 3.4);
            const warp2 = Noise2D.perlin(u * 11.5 + 4.3, v * 9.2 + nowSec * 5.2);

            const warpedU = Math.max(0.02, Math.min(0.98, u + warp1 * 0.036 + warp2 * 0.018));
            const lookupX = Math.round(warpedU * (fw - 1));
            const baseV = bottomEdgeVByU[lookupX];

            if (baseV > 0.35) {
              const dy = baseV - v;
              if (dy > -0.028 && dy < 0.30 * effInt) {
                const freqScale = layout.isPortrait ? 1.0 : 1.55;
                const tongueWave1 = Math.sin(warpedU * 24.0 * freqScale + Noise2D.perlin(warpedU * 5.0 * freqScale, nowSec * 1.9) * 2.5);
                const tongueWave2 = Math.cos(warpedU * 41.0 * freqScale - nowSec * 2.9 + warp1 * 1.9);
                const fbmTurb = Noise2D.fbm(warpedU * 9.0 * freqScale, v * 6.5 + nowSec * 4.2, 3, 2.0, 0.5) * 0.5 + 0.5;

                const tongueProfile = Math.max(0.14, 0.50 + 0.36 * tongueWave1 + 0.22 * tongueWave2) * (0.62 + 0.68 * fbmTurb);
                const lEdge = leftEdgeU > 0 ? leftEdgeU : 0.07;
                const rEdge = rightEdgeU > 0 ? rightEdgeU : 0.93;
                const spanW = Math.max(0.2, rEdge - lEdge);
                const normSpan = Math.max(0, Math.min(1, (u - (lEdge - 0.02)) / (spanW + 0.04)));
                const sideWindow = Math.pow(Math.sin(normSpan * Math.PI), 0.75);

                const localMaxH = (0.015 + 0.225 * tongueProfile * sideWindow) * effInt;

                if (dy < localMaxH && sideWindow > 0.02) {
                  const baseSoft = dy < 0 ? Math.max(0, 1.0 + dy / 0.026) : 1.0;
                  const hFrac = Math.max(0, dy) / localMaxH;
                  let hVal = Math.pow(1.0 - hFrac, 0.80) * baseSoft * (0.78 + 0.38 * fbmTurb) * Math.pow(sideWindow, 0.35);
                  const valleyMod = 0.70 + 0.30 * tongueWave1;
                  hVal *= valleyMod;
                  if (hVal > heat) heat = hVal;
                }
              }
            }

            if (v > 0.42 && v < 0.93) {
              const vEnv = Math.sin(Math.pow((v - 0.42) / 0.51, 0.8) * Math.PI);

              if (leftEdgeU > 0) {
                const distL = u - leftEdgeU;
                if (distL > -0.045 && distL < 0.14 * effInt) {
                  const upwardFlow = v * 6.5 + nowSec * 4.2;
                  const sideWave = Noise2D.fbm(u * 9.0 + 1.3, upwardFlow, 3, 2.0, 0.5) * 0.5 + 0.5;
                  const tongueLick = 0.5 + 0.5 * Math.sin(v * 26.0 + nowSec * 4.8 + sideWave * 3.0);

                  const reachIn = (0.018 + 0.095 * sideWave * tongueLick * vEnv) * effInt;
                  const reachOut = (0.015 + 0.028 * sideWave * vEnv) * effInt;

                  let sHeat = 0;
                  if (distL >= 0 && distL < reachIn) {
                    sHeat = Math.pow(1.0 - distL / reachIn, 0.85);
                  } else if (distL < 0 && -distL < reachOut) {
                    sHeat = Math.pow(1.0 - (-distL) / reachOut, 1.1);
                  }
                  sHeat *= vEnv * (0.68 + 0.42 * sideWave);
                  if (sHeat > heat) heat = sHeat;
                }
              }

              if (rightEdgeU > 0) {
                const distR = rightEdgeU - u;
                if (distR > -0.045 && distR < 0.14 * effInt) {
                  const upwardFlow = v * 6.5 + nowSec * 4.0 + 5.2;
                  const sideWave = Noise2D.fbm(u * 9.0 + 6.7, upwardFlow, 3, 2.0, 0.5) * 0.5 + 0.5;
                  const tongueLick = 0.5 + 0.5 * Math.cos(v * 25.0 + nowSec * 4.6 + sideWave * 3.0);

                  const reachIn = (0.018 + 0.095 * sideWave * tongueLick * vEnv) * effInt;
                  const reachOut = (0.015 + 0.028 * sideWave * vEnv) * effInt;

                  let sHeat = 0;
                  if (distR >= 0 && distR < reachIn) {
                    sHeat = Math.pow(1.0 - distR / reachIn, 0.85);
                  } else if (distR < 0 && -distR < reachOut) {
                    sHeat = Math.pow(1.0 - (-distR) / reachOut, 1.1);
                  }
                  sHeat *= vEnv * (0.68 + 0.42 * sideWave);
                  if (sHeat > heat) heat = sHeat;
                }
              }
            }

            if (heat <= 0.05) continue;

            const h = Math.min(1.0, heat * Math.min(1.2, intensity * 1.1));
            const pIdx = (fy * fw + fx) * 4;

            let r, g, b, a;
            if (h < 0.18) {
              const t = (h - 0.05) / 0.13;
              r = 45 + t * 95;
              g = 28 - t * 14;
              b = 22 - t * 18;
              a = t * t * 0.48;
            } else if (h < 0.46) {
              const t = (h - 0.18) / 0.28;
              const st = t * t * (3 - 2 * t);
              r = 140 + st * 92;
              g = 14 + st * 48;
              b = 4 + st * 4;
              a = 0.48 + st * 0.36;
            } else if (h < 0.76) {
              const t = (h - 0.46) / 0.30;
              const st = t * t * (3 - 2 * t);
              r = 232 + st * 23;
              g = 62 + st * 124;
              b = 8 + st * 28;
              a = 0.84 + st * 0.11;
            } else {
              const t = (h - 0.76) / 0.24;
              const st = t * t * (3 - 2 * t);
              r = 255;
              g = 186 + st * 66;
              b = 36 + st * 195;
              a = 0.95 + st * 0.05;
            }

            data[pIdx + 0] = r;
            data[pIdx + 1] = g;
            data[pIdx + 2] = b;
            data[pIdx + 3] = Math.round(a * 255);
          }
        }

        vCtx.putImageData(imgData, 0, 0);
      }

      function wrapTextCentered(ctx, text, x, y, maxWidth, lineHeight) {
        const paragraphs = String(text).split('\n');
        const lines = [];
        for (const para of paragraphs) {
          const words = para.split(/\s+/);
          let currentLine = '';
          for (let i = 0; i < words.length; i++) {
            const testLine = currentLine ? currentLine + ' ' + words[i] : words[i];
            if (ctx.measureText(testLine).width > maxWidth && currentLine) {
              lines.push(currentLine);
              currentLine = words[i];
            } else {
              currentLine = testLine;
            }
          }
          if (currentLine) lines.push(currentLine);
        }
        const totalH = (lines.length - 1) * lineHeight;
        let currY = y - totalH / 2;
        for (const ln of lines) {
          ctx.fillText(ln, x, currY);
          currY += lineHeight;
        }
      }

      /* ========================================================================
       * 6. HỆ THỐNG HẠT: KHÓI XÁM CUỘN, TÀN LỬA LI TI, MẢNH TRO BONG,
       *    GIỌT NƯỚC THEO NÉT VẼ, MƯA DỘI, GỢN NƯỚC LOANG & HƠI NƯỚC TRẮNG
       * ======================================================================== */
      const particles = {
        smoke: [],
        sparks: [],
        ashFlakes: [],
        strokeDrops: [],
        rain: [],
        ripples: [],
        splashes: [],
        steam: []
      };

      function spawnBurningParticles(dt, nowSec) {
        if (state.fireIntensity <= 0.05 || allBurnPerimeter.length === 0) return;
        const px = layout.paperX;
        const py = layout.paperY;
        const pw = layout.paperW;
        const ph = layout.paperH;
        const scale = Math.min(pw, ph);

        if (particles.smoke.length < 22 && Math.random() < dt * 12 * state.fireIntensity) {
          const anchor = allBurnPerimeter[Math.floor(Math.random() * allBurnPerimeter.length)];
          particles.smoke.push({
            x: px + anchor.u * pw + (Math.random() - 0.5) * scale * 0.05,
            y: py + anchor.v * ph - scale * 0.11 * state.fireIntensity,
            vx: (Math.random() - 0.5) * 14,
            vy: -(30 + Math.random() * 26),
            r: scale * (0.038 + Math.random() * 0.032),
            maxR: scale * (0.12 + Math.random() * 0.06),
            age: 0,
            life: 2.0 + Math.random() * 1.2,
            seed: Math.random() * 100
          });
        }

        const sparkRate = (6 + state.fireFlareBoost * 16) * state.fireIntensity;
        if (particles.sparks.length < 14 && Math.random() < dt * sparkRate) {
          const anchor = allBurnPerimeter[Math.floor(Math.random() * allBurnPerimeter.length)];
          particles.sparks.push({
            x: px + anchor.u * pw + (Math.random() - 0.5) * scale * 0.04,
            y: py + anchor.v * ph - scale * 0.03,
            vx: (Math.random() - 0.5) * 24,
            vy: -(58 + Math.random() * 62) * (1 + state.fireFlareBoost * 0.4),
            size: Math.max(1.2, scale * (0.0036 + Math.random() * 0.0024)),
            age: 0,
            life: 1.0 + Math.random() * 1.0,
            seed: Math.random() * 50
          });
        }

        if (particles.ashFlakes.length < 5 && Math.random() < dt * 0.75 * state.fireIntensity) {
          const anchor = allBurnPerimeter[Math.floor(Math.random() * allBurnPerimeter.length)];
          particles.ashFlakes.push({
            x: px + anchor.u * pw,
            y: py + anchor.v * ph,
            vx: (Math.random() - 0.5) * 18,
            vy: -(22 + Math.random() * 20),
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 3.2,
            size: Math.max(2.5, scale * (0.0085 + Math.random() * 0.005)),
            age: 0,
            life: 1.7 + Math.random() * 0.9,
            seed: Math.random() * 30
          });
        }
      }

      function spawnDousingParticles(dt, nowSec) {
        if (state.phase !== 'DOUSING' && state.phase !== 'REVEALING') return;
        const elapsedDouse = (performance.now() - state.douseStartTime) / 1000;
        const px = layout.paperX;
        const py = layout.paperY;
        const pw = layout.paperW;
        const ph = layout.paperH;
        const scale = Math.min(pw, ph);

        if (elapsedDouse < 1.8 && particles.rain.length < 55) {
          const count = Math.min(5, Math.ceil(dt * 95));
          for (let i = 0; i < count; i++) {
            const targetX = px + (0.06 + Math.random() * 0.88) * pw;
            const targetY = py + (0.12 + Math.random() * 0.80) * ph;
            const travel = 160 + Math.random() * 220;
            particles.rain.push({
              x: targetX - travel * 0.14,
              y: targetY - travel,
              targetY,
              vx: 75,
              vy: 560 + Math.random() * 220,
              len: 18 + Math.random() * 16,
              alpha: 0.55 + Math.random() * 0.35
            });
          }
        }

        if (elapsedDouse < 1.9 && particles.steam.length < 36 && allBurnPerimeter.length > 0) {
          const steamCount = Math.min(3, Math.ceil(dt * 30));
          for (let i = 0; i < steamCount; i++) {
            const anchor = allBurnPerimeter[Math.floor(Math.random() * allBurnPerimeter.length)];
            particles.steam.push({
              x: px + anchor.u * pw + (Math.random() - 0.5) * scale * 0.08,
              y: py + anchor.v * ph + (Math.random() - 0.5) * scale * 0.03,
              vx: (Math.random() - 0.5) * 28,
              vy: -(56 + Math.random() * 48),
              r: scale * (0.042 + Math.random() * 0.032),
              maxR: scale * (0.14 + Math.random() * 0.08),
              age: 0,
              life: 1.05 + Math.random() * 0.65,
              alpha: 0.46 + Math.random() * 0.24
            });
          }
        }
      }

      function updateAndDrawParticles(ctx, dt, nowSec) {
        ctx.save();

        for (let i = particles.smoke.length - 1; i >= 0; i--) {
          const p = particles.smoke[i];
          p.age += dt;
          if (p.age >= p.life) {
            particles.smoke.splice(i, 1);
            continue;
          }
          const t = p.age / p.life;
          p.x += (p.vx + Math.sin(nowSec * 2.2 + p.seed) * 16) * dt;
          p.y += p.vy * dt;
          const r = p.r + (p.maxR - p.r) * t;
          const alpha = Math.sin(t * Math.PI) * 0.18;

          const g = ctx.createRadialGradient(p.x, p.y, r * 0.1, p.x, p.y, r);
          g.addColorStop(0, `rgba(96, 80, 70, ${alpha})`);
          g.addColorStop(0.6, `rgba(62, 50, 44, ${alpha * 0.5})`);
          g.addColorStop(1, 'rgba(30, 24, 20, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = particles.ashFlakes.length - 1; i >= 0; i--) {
          const p = particles.ashFlakes[i];
          p.age += dt;
          if (p.age >= p.life) {
            particles.ashFlakes.splice(i, 1);
            continue;
          }
          const t = p.age / p.life;
          p.x += (p.vx + Math.sin(nowSec * 4.0 + p.seed) * 20) * dt;
          p.y += p.vy * dt;
          p.rot += p.vRot * dt;
          const alpha = (1 - t * t) * 0.85;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = `rgba(28, 18, 12, ${alpha})`;
          ctx.strokeStyle = `rgba(255, 110, 25, ${Math.max(0, (1 - t * 1.8) * 0.75)})`;
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.moveTo(-p.size, -p.size * 0.5);
          ctx.lineTo(p.size * 0.8, -p.size * 0.7);
          ctx.lineTo(p.size, p.size * 0.4);
          ctx.lineTo(-p.size * 0.4, p.size * 0.8);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.sparks.length - 1; i >= 0; i--) {
          const p = particles.sparks[i];
          p.age += dt;
          if (p.age >= p.life) {
            particles.sparks.splice(i, 1);
            continue;
          }
          const t = p.age / p.life;
          const prevX = p.x;
          const prevY = p.y;
          const sway = Math.sin(nowSec * 5.2 + p.seed + p.age * 4.0) * 28;
          p.x += (p.vx + sway) * dt;
          p.y += p.vy * dt;

          const alpha = Math.sin(t * Math.PI) * (1 - t * 0.4);
          ctx.strokeStyle = `rgba(255, ${Math.round(210 - t * 110)}, ${Math.round(90 - t * 70)}, ${alpha})`;
          ctx.lineWidth = p.size * (1 - t * 0.45);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }

        ctx.globalCompositeOperation = 'screen';
        for (let i = particles.strokeDrops.length - 1; i >= 0; i--) {
          const p = particles.strokeDrops[i];
          p.age += dt;
          if (p.age >= p.life) {
            particles.strokeDrops.splice(i, 1);
            continue;
          }
          const t = p.age / p.life;
          p.vy += 95 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          const alpha = (1 - t) * 0.85;
          ctx.fillStyle = `rgba(175, 245, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (1 - t * 0.4), 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = particles.rain.length - 1; i >= 0; i--) {
          const r = particles.rain[i];
          r.x += r.vx * dt;
          r.y += r.vy * dt;

          ctx.strokeStyle = `rgba(195, 244, 255, ${r.alpha})`;
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(r.x, r.y);
          ctx.lineTo(r.x - r.len * 0.14, r.y - r.len);
          ctx.stroke();

          if (r.y >= r.targetY) {
            if (particles.ripples.length < 28) {
              particles.ripples.push({
                x: r.x,
                y: r.targetY,
                r: 2,
                maxR: 18 + Math.random() * 24,
                age: 0,
                life: 0.55 + Math.random() * 0.35
              });
            }
            for (let s = 0; s < 2; s++) {
              particles.splashes.push({
                x: r.x,
                y: r.targetY,
                vx: (Math.random() - 0.5) * 65,
                vy: -(35 + Math.random() * 45),
                r: 1.3 + Math.random() * 1.2,
                age: 0,
                life: 0.28 + Math.random() * 1.2
              });
            }
            particles.rain.splice(i, 1);
          }
        }

        for (let i = particles.ripples.length - 1; i >= 0; i--) {
          const rp = particles.ripples[i];
          rp.age += dt;
          if (rp.age >= rp.life) {
            particles.ripples.splice(i, 1);
            continue;
          }
          const t = rp.age / rp.life;
          const rad = rp.r + (rp.maxR - rp.r) * Math.pow(t, 0.75);
          const alpha = (1 - t) * 0.52;
          ctx.strokeStyle = `rgba(185, 242, 255, ${alpha})`;
          ctx.lineWidth = 1.3 * (1 - t * 0.5);
          ctx.beginPath();
          ctx.ellipse(rp.x, rp.y, rad, rad * 0.68, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (let i = particles.splashes.length - 1; i >= 0; i--) {
          const sp = particles.splashes[i];
          sp.age += dt;
          if (sp.age >= sp.life) {
            particles.splashes.splice(i, 1);
            continue;
          }
          const t = sp.age / sp.life;
          sp.vy += 180 * dt;
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          ctx.fillStyle = `rgba(215, 250, 255, ${(1 - t) * 0.85})`;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalCompositeOperation = 'source-over';
        for (let i = particles.steam.length - 1; i >= 0; i--) {
          const st = particles.steam[i];
          st.age += dt;
          if (st.age >= st.life) {
            particles.steam.splice(i, 1);
            continue;
          }
          const t = st.age / st.life;
          st.x += (st.vx + Math.sin(nowSec * 3.0 + i) * 18) * dt;
          st.y += st.vy * dt;
          const rad = st.r + (st.maxR - st.r) * Math.pow(t, 0.7);
          const alpha = Math.sin(t * Math.PI) * st.alpha;

          const g = ctx.createRadialGradient(st.x, st.y, rad * 0.1, st.x, st.y, rad);
          g.addColorStop(0, `rgba(242, 248, 252, ${alpha})`);
          g.addColorStop(0.55, `rgba(215, 228, 236, ${alpha * 0.55})`);
          g.addColorStop(1, 'rgba(190, 210, 225, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(st.x, st.y, rad, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      /* ========================================================================
       * 7. VẼ NÉT CHÌA KHÓA NƯỚC & HIỆU ỨNG CUỘN MẬT THƯ MỞ RA (UNROLLING SCROLL)
       * ======================================================================== */
      function drawWaterStrokes(ctx, nowSec) {
        const allStrokes = state.activeStroke
          ? state.strokes.concat([state.activeStroke])
          : state.strokes;

        if (allStrokes.length === 0) return;

        ctx.save();
        let globalAlpha = 1.0;
        let offsetY = 0;

        if (state.strokeEvaporating) {
          globalAlpha = Math.max(0, 1 - state.strokeEvaporateProgress);
          offsetY = -state.strokeEvaporateProgress * 26;
        }

        const isSuccessGlow = state.strokeGlowingSuccess;
        const pulse = 0.88 + 0.12 * Math.sin(nowSec * 6.0);

        for (const pts of allStrokes) {
          if (!pts || pts.length < 2) continue;

          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y + offsetY);
          for (let i = 1; i < pts.length - 1; i++) {
            const mx = (pts[i].x + pts[i + 1].x) * 0.5;
            const my = (pts[i].y + pts[i + 1].y) * 0.5 + offsetY;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y + offsetY, mx, my);
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(last.x, last.y + offsetY);

          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (state.strokeEvaporating) {
            ctx.globalCompositeOperation = 'screen';
            ctx.strokeStyle = `rgba(235, 242, 248, ${globalAlpha * 0.55})`;
            ctx.lineWidth = 14 + state.strokeEvaporateProgress * 18;
            ctx.stroke();
          } else {
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = isSuccessGlow
              ? `rgba(120, 245, 255, ${0.75 * globalAlpha})`
              : `rgba(56, 188, 255, ${0.42 * pulse * globalAlpha})`;
            ctx.lineWidth = isSuccessGlow ? 22 : 14;
            ctx.stroke();

            ctx.strokeStyle = isSuccessGlow
              ? `rgba(200, 252, 255, ${0.95 * globalAlpha})`
              : `rgba(110, 232, 255, ${0.82 * globalAlpha})`;
            ctx.lineWidth = isSuccessGlow ? 10 : 6.5;
            ctx.stroke();

            ctx.strokeStyle = `rgba(242, 254, 255, ${0.96 * globalAlpha})`;
            ctx.lineWidth = isSuccessGlow ? 4.5 : 2.6;
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Hàm vẽ 1 thanh trục cuộn gỗ mun nạm đồng vàng 3D trên canvas trong lúc cuộn thư đang lăn mở
      function drawScrollRoller3D(ctx, cx, cy, width, thickness, rollAngle = 0) {
        const halfW = width * 0.5;
        const halfH = thickness * 0.5;
        const knobW = Math.max(12, width * 0.045);
        const knobH = thickness * 1.28;

        ctx.save();

        // Bóng đổ đậm phía dưới trục cuộn
        ctx.shadowColor = 'rgba(0, 0, 0, 0.82)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 7;

        // Đầu trục chạm đồng vàng 2 bên (End-knobs)
        const knobGrad = ctx.createLinearGradient(0, cy - knobH * 0.5, 0, cy + knobH * 0.5);
        knobGrad.addColorStop(0, '#fff2bd');
        knobGrad.addColorStop(0.32, '#d9ab4e');
        knobGrad.addColorStop(0.72, '#785014');
        knobGrad.addColorStop(1, '#2b1904');
        ctx.fillStyle = knobGrad;

        // Đầu trái
        ctx.beginPath();
        ctx.roundRect(cx - halfW - knobW * 0.85, cy - knobH * 0.5, knobW, knobH, 5);
        ctx.fill();
        // Đầu phải
        ctx.beginPath();
        ctx.roundRect(cx + halfW - knobW * 0.15, cy - knobH * 0.5, knobW, knobH, 5);
        ctx.fill();

        // Thân ống cuộn (Gỗ mun + đai đồng giả kim + giấy cuộn)
        const rodGrad = ctx.createLinearGradient(0, cy - halfH, 0, cy + halfH);
        rodGrad.addColorStop(0, '#784e27');
        rodGrad.addColorStop(0.18, '#2d1809');
        rodGrad.addColorStop(0.46, '#9c6c34');
        rodGrad.addColorStop(0.55, '#f6d88c');
        rodGrad.addColorStop(0.76, '#6e471b');
        rodGrad.addColorStop(1, '#1c0d04');

        ctx.fillStyle = rodGrad;
        ctx.strokeStyle = 'rgba(246, 216, 140, 0.78)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(cx - halfW, cy - halfH, width, thickness, halfH);
        ctx.fill();
        ctx.stroke();

        // Các vòng đai khắc vàng quay theo góc lăn khi cuộn giấy mở xuống
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = 'rgba(255, 232, 165, 0.45)';
        ctx.lineWidth = 1.5;
        const numRings = 7;
        for (let i = 1; i < numRings; i++) {
          const rx = cx - halfW + (width * i) / numRings;
          const phaseShift = Math.sin(rollAngle + i) * 2.5;
          ctx.beginPath();
          ctx.moveTo(rx + phaseShift, cy - halfH + 1.5);
          ctx.lineTo(rx - phaseShift, cy + halfH - 1.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      // Vẽ hoạt ảnh Cuộn Mật Thư mở dần từ trên xuống dưới sau khi tưới nước
      function drawUnrollingScrollCanvas(ctx, nowSec) {
        if (state.revealProgress <= 0.002) return;

        const slot = layout.isPortrait ? cipherImages.portrait : cipherImages.landscape;
        const img = slot.img || cipherImages.portrait.img;
        if (!img) return;

        // Nội suy mượt tiến độ lăn mở cuộn thư (Cubic ease-out)
        const rawP = Math.max(0, Math.min(1, state.revealProgress));
        const unrollP = 1 - Math.pow(1 - rawP, 2.8);

        // Kích thước cuộn thư khớp với khung scroll-artifact để chuyển giao mượt sang chế độ cuộn
        const scrollW = Math.min(layout.vw * 0.90, 520, layout.paperW * 1.04);
        const imgAspect = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (1024 / 1536);
        const fullScrollH = scrollW / imgAspect;

        // Giới hạn chiều cao hiển thị trên sân khấu trong lúc đang mở cuộn
        const visibleMaxH = Math.min(fullScrollH, layout.vh * 0.76);
        const cx = layout.vw * 0.5;
        const topY = (layout.vh - visibleMaxH) * 0.47;
        const currentH = Math.max(8, visibleMaxH * unrollP);
        const sx = cx - scrollW * 0.5;

        ctx.save();

        // 1. Phần thân cuộn mật thư đã được mở ra (từ topY xuống topY + currentH)
        ctx.save();
        ctx.beginPath();
        ctx.rect(sx, topY, scrollW, currentH);
        ctx.clip();

        // Nền tối dưới bức mật thư
        ctx.fillStyle = '#180d06';
        ctx.fillRect(sx, topY, scrollW, currentH);

        // Lúc mới bắt đầu mở cuộn, màu hơi ngả sepia ấm rồi chuyển nhanh sang rõ nét 100%
        const sepiaAmt = Math.max(0, (1 - rawP * 1.45) * 0.65);
        if (sepiaAmt > 0.03 && typeof ctx.filter === 'string') {
          ctx.filter = `sepia(${sepiaAmt.toFixed(2)})`;
        }
        // Khung thấp hơn hình thì chỉ hiện phần trên của hình, không bóp dẹt
        const srcH = img.naturalHeight * (visibleMaxH / fullScrollH);
        ctx.drawImage(img, 0, 0, img.naturalWidth, srcH, sx, topY, scrollW, visibleMaxH);
        ctx.filter = 'none';

        // Bóng đổ chiều sâu ngay dưới trục cuộn trên và sát trên trục cuộn dưới đang lăn
        const topShadow = ctx.createLinearGradient(0, topY, 0, topY + 28);
        topShadow.addColorStop(0, 'rgba(0, 0, 0, 0.72)');
        topShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = topShadow;
        ctx.fillRect(sx, topY, scrollW, 28);

        const botShadow = ctx.createLinearGradient(0, topY + currentH - 32, 0, topY + currentH);
        botShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
        botShadow.addColorStop(1, 'rgba(0, 0, 0, 0.78)');
        ctx.fillStyle = botShadow;
        ctx.fillRect(sx, topY + currentH - 32, scrollW, 32);

        // Vệt sáng nước phép thuật lấp lánh chạy ngay sát mép ống cuộn đang mở xuống
        if (rawP < 0.98) {
          const waterLineGrad = ctx.createLinearGradient(0, topY + currentH - 22, 0, topY + currentH);
          waterLineGrad.addColorStop(0, 'rgba(110, 231, 255, 0)');
          waterLineGrad.addColorStop(0.65, `rgba(145, 242, 255, ${(1 - rawP) * 0.55})`);
          waterLineGrad.addColorStop(1, `rgba(235, 253, 255, ${(1 - rawP) * 0.85})`);
          ctx.fillStyle = waterLineGrad;
          ctx.fillRect(sx, topY + currentH - 22, scrollW, 22);
        }

        // Viền nhũ vàng hai bên mép cuộn thư
        ctx.strokeStyle = 'rgba(212, 168, 79, 0.65)';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 1, topY, scrollW - 2, currentH);
        ctx.restore();

        // 2. Thanh trục cuộn cố định phía trên (Top Scroll Roller)
        const rollerW = scrollW * 1.06;
        drawScrollRoller3D(ctx, cx, topY, rollerW, 22, 0);

        // 3. Thanh trục cuộn phía dưới đang lăn mở xuống (Rolling Bottom Cylinder)
        // Khi mới mở (unrollP nhỏ), cuộn giấy còn dày (28px); càng lăn xuống cuối càng mỏng dần (20px)
        const bottomThickness = 28 - unrollP * 7;
        const rollAngle = unrollP * Math.PI * 8;
        drawScrollRoller3D(ctx, cx, topY + currentH, rollerW, bottomThickness, rollAngle);

        ctx.restore();
      }

      function composePaperLayer(nowSec) {
        const bw = layout.bufW;
        const bh = layout.bufH;
        const cCtx = paperCompositeCanvas.getContext('2d');
        cCtx.clearRect(0, 0, bw, bh);

        cCtx.drawImage(paperRenderCanvas, 0, 0);

        cCtx.save();
        cCtx.globalCompositeOperation = 'source-atop';

        if (state.hintOpacity > 0.01) {
          cCtx.save();
          cCtx.globalAlpha = state.hintOpacity;
          const cx = bw * 0.5;
          const topY = bh * 0.23;

          cCtx.fillStyle = '#331908';
          cCtx.textAlign = 'center';
          cCtx.textBaseline = 'middle';

          const labelSize = Math.max(15, Math.round(Math.min(bw, bh) * 0.058));
          cCtx.font = `italic 700 ${labelSize}px "Cormorant Garamond", "C059", "Caladea", Georgia, serif`;
          cCtx.fillText(BANG_DIEU_CHINH.tieuDeTrenGiay, cx, topY);

          cCtx.strokeStyle = 'rgba(65, 32, 12, 0.45)';
          cCtx.lineWidth = 1.1;
          cCtx.beginPath();
          cCtx.moveTo(cx - bw * 0.16, topY + labelSize * 0.72);
          cCtx.lineTo(cx + bw * 0.16, topY + labelSize * 0.72);
          cCtx.stroke();

          const hintSize = Math.max(15, Math.round(Math.min(bw, bh) * 0.054));
          cCtx.font = `italic 600 ${hintSize}px "Cormorant Garamond", "C059", "Caladea", Georgia, serif`;
          cCtx.fillStyle = '#3d1e0a';
          wrapTextCentered(
            cCtx,
            BANG_DIEU_CHINH.cauGoiY,
            cx,
            bh * 0.43,
            bw * 0.72,
            hintSize * 1.42
          );
          cCtx.restore();
        }

        if (state.fireIntensity > 0.02) {
          const glowGrad = cCtx.createRadialGradient(
            bw * 0.5, bh * 0.92, bw * 0.05,
            bw * 0.5, bh * 0.85, bh * 0.62
          );
          const glowAlpha = (0.20 + 0.06 * Math.sin(nowSec * 8.3) + state.fireFlareBoost * 0.18) * state.fireIntensity;
          glowGrad.addColorStop(0, `rgba(255, 150, 38, ${glowAlpha})`);
          glowGrad.addColorStop(0.55, `rgba(220, 68, 12, ${glowAlpha * 0.42})`);
          glowGrad.addColorStop(1, 'rgba(180, 30, 0, 0)');
          cCtx.fillStyle = glowGrad;
          cCtx.fillRect(0, 0, bw, bh);
        }

        cCtx.restore();
      }

      /* ========================================================================
       * 8. BỐ CỤC MÀN HÌNH
       * ======================================================================== */
      function rebuildLayoutAndPaper() {
        layout.vw = window.innerWidth;
        layout.vh = window.innerHeight;
        layout.dpr = Math.min(window.devicePixelRatio || 1, 2);
        layout.isPortrait = layout.vh >= layout.vw;

        sceneCanvas.width = Math.round(layout.vw * layout.dpr);
        sceneCanvas.height = Math.round(layout.vh * layout.dpr);
        fxCanvas.width = Math.round(layout.vw * layout.dpr);
        fxCanvas.height = Math.round(layout.vh * layout.dpr);

        const slot = layout.isPortrait ? cipherImages.portrait : cipherImages.landscape;
        const targetAspect = slot.width / slot.height;

        const maxW = layout.vw * (layout.isPortrait ? 0.84 : 0.78);
        const maxH = layout.vh * (layout.isPortrait ? 0.76 : 0.74);

        let pw = maxW;
        let ph = pw / targetAspect;
        if (ph > maxH) {
          ph = maxH;
          pw = ph * targetAspect;
        }

        layout.paperW = Math.round(pw);
        layout.paperH = Math.round(ph);
        layout.paperX = Math.round((layout.vw - pw) * 0.5);
        layout.paperY = Math.round((layout.vh - ph) * 0.48);

        const maxBufDim = 560;
        if (pw >= ph) {
          layout.bufW = maxBufDim;
          layout.bufH = Math.max(240, Math.round(maxBufDim / targetAspect));
          layout.fireBufW = 320;
          layout.fireBufH = Math.max(160, Math.round(320 / targetAspect));
        } else {
          layout.bufH = maxBufDim;
          layout.bufW = Math.max(240, Math.round(maxBufDim * targetAspect));
          layout.fireBufH = 320;
          layout.fireBufW = Math.max(160, Math.round(320 * targetAspect));
        }

        buildPaperBuffers();
        renderSingleFrame(performance.now());
      }

      /* ========================================================================
       * 9. XỬ LÝ TƯƠNG TÁC VẼ CHÌA KHÓA & CUỘN XEM / THU PHÓNG SAU KHI GIẢI XONG
       * ======================================================================== */
      function clearRecognitionTimers() {
        if (state.evalTimer) {
          clearTimeout(state.evalTimer);
          state.evalTimer = null;
        }
        if (state.waitSecondTimer) {
          clearTimeout(state.waitSecondTimer);
          state.waitSecondTimer = null;
        }
      }

      function triggerWrongFeedback() {
        SoundEngine.playFireFlare();
        state.fireFlareBoost = 1.65;
        state.shakeAmount = 9.0;
        state.strokeEvaporating = true;
        state.strokeEvaporateProgress = 0;
        bottomGuide.textContent = BANG_DIEU_CHINH.dongHuongDanBanDau;
        showToast(BANG_DIEU_CHINH.thongBaoVeSai, false, 2600);
      }

      function triggerCorrectSequence() {
        clearRecognitionTimers();
        state.phase = 'DOUSING';
        state.douseStartTime = performance.now();
        state.strokeGlowingSuccess = true;
        appEl.classList.add('extinguished');

        SoundEngine.playWaterAndSizzle();
        showToast(BANG_DIEU_CHINH.thongBaoVeDung, true, 4200);

        for (const s of state.strokes) {
          for (let i = 0; i < s.length; i += 2) {
            const pt = s[i];
            if (particles.strokeDrops.length < 75) {
              particles.strokeDrops.push({
                x: pt.x,
                y: pt.y,
                vx: (Math.random() - 0.5) * 90,
                vy: (Math.random() - 0.5) * 90 - 20,
                r: 2.0 + Math.random() * 2.2,
                age: 0,
                life: 0.65 + Math.random() * 0.45
              });
            }
            if (i % 8 === 0 && particles.ripples.length < 28) {
              particles.ripples.push({
                x: pt.x,
                y: pt.y,
                r: 3,
                maxR: 32 + Math.random() * 26,
                age: 0,
                life: 0.75 + Math.random() * 0.35
              });
            }
          }
        }
      }

      function evaluateCurrentDrawing(isFinalTimeoutAfterWait = false) {
        if (state.phase !== 'BURNING' || state.strokes.length === 0) return;

        const result = WaterRecognizer.evaluateStrokes(state.strokes);

        if (result.status === 'CORRECT') {
          triggerCorrectSequence();
        } else if (result.status === 'WAIT' && !isFinalTimeoutAfterWait) {
          bottomGuide.textContent = BANG_DIEU_CHINH.dongHuongDanChoThemNet;
          state.waitSecondTimer = setTimeout(() => {
            evaluateCurrentDrawing(true);
          }, BANG_DIEU_CHINH.thoiGianChoNetThuHaiMs);
        } else {
          triggerWrongFeedback();
        }
      }

      function setZoomLevel(newZoom) {
        state.zoom = Math.max(1, Math.min(2.6, newZoom));
        const baseW = Math.min(window.innerWidth * 0.92, 560);
        scrollArtifact.style.width = `${Math.round(baseW * state.zoom)}px`;
      }

      zoomInBtn.addEventListener('click', () => setZoomLevel(state.zoom + 0.35));
      zoomOutBtn.addEventListener('click', () => setZoomLevel(state.zoom - 0.35));
      zoomResetBtn.addEventListener('click', () => {
        setZoomLevel(1);
        scrollViewer.scrollTo({ top: 0, behavior: 'smooth' });
      });

      audioBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        SoundEngine.toggle();
        updateAudioButtonUI();
      });

      function getPointerPos(e) {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function onPointerDown(e) {
        SoundEngine.initAndUnlock();
        if (state.phase !== 'BURNING') return;
        if (e.touches && e.touches.length > 1) return;

        clearRecognitionTimers();

        if (state.strokeEvaporating) {
          state.strokes = [];
          state.strokeEvaporating = false;
          state.strokeEvaporateProgress = 0;
        }

        const pos = getPointerPos(e);
        state.activeStroke = [pos];
      }

      function onPointerMove(e) {
        if (state.phase !== 'BURNING' || !state.activeStroke) return;
        const pos = getPointerPos(e);
        const last = state.activeStroke[state.activeStroke.length - 1];
        const d = Math.hypot(pos.x - last.x, pos.y - last.y);

        if (d >= 3) {
          state.activeStroke.push(pos);
          if (particles.strokeDrops.length < 40 && Math.random() < 0.65) {
            particles.strokeDrops.push({
              x: pos.x + (Math.random() - 0.5) * 6,
              y: pos.y + (Math.random() - 0.5) * 6,
              vx: (Math.random() - 0.5) * 18,
              vy: 8 + Math.random() * 22,
              r: 1.4 + Math.random() * 1.5,
              age: 0,
              life: 0.45 + Math.random() * 0.35
            });
          }
        }
      }

      function onPointerUp() {
        if (state.phase !== 'BURNING' || !state.activeStroke) return;
        if (state.activeStroke.length >= 2) {
          state.strokes.push(state.activeStroke);
        }
        state.activeStroke = null;

        clearRecognitionTimers();
        state.evalTimer = setTimeout(() => {
          evaluateCurrentDrawing(false);
        }, BANG_DIEU_CHINH.thoiGianChoChamBaiMs);
      }

      fxCanvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      fxCanvas.addEventListener('touchstart', (e) => {
        if (state.phase !== 'BURNING') return;
        e.preventDefault();
        onPointerDown(e);
      }, { passive: false });

      fxCanvas.addEventListener('touchmove', (e) => {
        if (state.phase !== 'BURNING') return;
        e.preventDefault();
        onPointerMove(e);
      }, { passive: false });

      window.addEventListener('touchend', onPointerUp);
      window.addEventListener('touchcancel', onPointerUp);

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(rebuildLayoutAndPaper, 80);
      });

      /* ========================================================================
       * 10. VÒNG LẶP HOẠT HÌNH CHÍNH (MỤC TIÊU 60FPS, TỰ DỪNG KHI GIẢI XONG)
       * ======================================================================== */
      function renderSingleFrame(nowMs) {
        const dt = Math.min(0.05, Math.max(0.001, (nowMs - state.lastFrameTime) / 1000));
        state.lastFrameTime = nowMs;
        const nowSec = (nowMs - state.startTime) / 1000;

        if (state.phase === 'BURNING') {
          state.emberCreep = Math.min(1.0, 1.0 - Math.exp(-nowSec / 22.0));

          if (state.fireFlareBoost > 0) {
            state.fireFlareBoost = Math.max(0, state.fireFlareBoost - dt * 2.1);
          }
          if (state.shakeAmount > 0.05) {
            state.shakeAmount *= Math.pow(0.015, dt);
          } else {
            state.shakeAmount = 0;
          }

          if (state.strokeEvaporating) {
            state.strokeEvaporateProgress += dt * 1.65;
            if (state.strokeEvaporateProgress >= 1.0) {
              state.strokeEvaporating = false;
              state.strokeEvaporateProgress = 0;
              state.strokes = [];
            }
          }
        } else if (state.phase === 'DOUSING') {
          const douseSec = (nowMs - state.douseStartTime) / 1000;
          state.fireIntensity = Math.max(0, 1.0 - douseSec / 1.75);
          state.wetness = Math.min(1.0, douseSec / 1.4);
          state.hintOpacity = Math.max(0, 1.0 - Math.max(0, douseSec - 0.35) / 0.85);

          if (douseSec > 0.50 && state.strokeGlowingSuccess) {
            state.strokeGlowingSuccess = false;
            state.strokes = [];
          }

          if (douseSec >= 1.05) {
            state.phase = 'REVEALING';
            state.revealStartTime = nowMs;
            SoundEngine.playRevealChime();
            bottomGuide.textContent = BANG_DIEU_CHINH.dongHuongDanKhiGiaiXong;
          }
        } else if (state.phase === 'REVEALING') {
          const douseSec = (nowMs - state.douseStartTime) / 1000;
          const revSec = (nowMs - state.revealStartTime) / 1000;
          state.fireIntensity = Math.max(0, 1.0 - douseSec / 1.75);
          state.wetness = Math.min(1.0, douseSec / 1.4);
          state.hintOpacity = Math.max(0, 1.0 - revSec / 0.6);
          // Tiến độ lăn mở cuộn mật thư từ trên xuống dưới trong 2.3 giây
          state.revealProgress = Math.min(1.0, revSec / 2.3);

          if (
            state.revealProgress >= 1.0 &&
            state.fireIntensity <= 0 &&
            particles.rain.length === 0 &&
            particles.steam.length === 0 &&
            particles.ripples.length === 0
          ) {
            state.phase = 'SOLVED';
            document.body.classList.add('solved');
          }
        }

        if (state.fireIntensity > 0.01) {
          const flicker = 0.88 + 0.12 * Math.sin(nowSec * 9.5) + 0.08 * Math.cos(nowSec * 14.2) + state.fireFlareBoost * 0.35;
          ambientGlowEl.style.opacity = String(Math.min(1, state.fireIntensity * flicker));
          ambientGlowEl.style.transform = `scale(${(0.98 + 0.04 * flicker).toFixed(3)})`;
        } else {
          ambientGlowEl.style.opacity = '0';
        }

        if (nowMs - lastPaperUpdateMs > 42 || state.phase === 'SOLVED') {
          updatePaperDynamicSurface(nowSec);
          lastPaperUpdateMs = nowMs;
        }

        composePaperLayer(nowSec);

        sCtx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);
        sCtx.clearRect(0, 0, layout.vw, layout.vh);

        const shakeX = state.shakeAmount > 0 ? Math.sin(nowSec * 52) * state.shakeAmount : 0;
        const shakeY = state.shakeAmount > 0 ? Math.cos(nowSec * 46) * state.shakeAmount * 0.6 : 0;

        sCtx.save();
        sCtx.translate(shakeX, shakeY);

        // Làm mờ nhẹ tờ giấy nền khi cuộn mật thư đã mở hoàn toàn
        const bgPaperAlpha = state.phase === 'SOLVED'
          ? 0.15
          : Math.max(0.25, 1.0 - state.revealProgress * 0.72);

        sCtx.save();
        sCtx.globalAlpha = bgPaperAlpha;
        sCtx.shadowColor = state.fireIntensity > 0.1
          ? `rgba(255, 95, 12, ${0.38 * state.fireIntensity})`
          : 'rgba(0, 0, 0, 0.78)';
        sCtx.shadowBlur = 32;
        sCtx.shadowOffsetY = 10;
        sCtx.drawImage(paperCompositeCanvas, layout.paperX, layout.paperY, layout.paperW, layout.paperH);
        sCtx.restore();

        // Vẽ hoạt ảnh Cuộn Mật Thư lăn mở từ trên xuống dưới (khi đang trong giai đoạn REVEALING)
        if (state.phase === 'REVEALING' || (state.revealProgress > 0 && state.phase !== 'SOLVED')) {
          drawUnrollingScrollCanvas(sCtx, nowSec);
        }

        sCtx.restore();

        renderVolumetricFireField(nowSec, state.fireIntensity);

        fCtx.setTransform(layout.dpr, 0, 0, layout.dpr, 0, 0);
        fCtx.clearRect(0, 0, layout.vw, layout.vh);

        fCtx.save();
        fCtx.translate(shakeX, shakeY);

        if (!prefersReducedMotion) {
          spawnBurningParticles(dt, nowSec);
          spawnDousingParticles(dt, nowSec);
        }

        if (state.fireIntensity > 0.01) {
          // Làm mờ ngay trên khung lửa nhỏ rồi mới phóng to: nhìn như làm mờ sau khi
          // phóng to nhưng xử lý ít điểm ảnh hơn nhiều. Độ mờ của canvas tính bằng điểm
          // ảnh thật, nên quy đổi theo tỉ lệ khung lửa / kích thước giấy trên màn hình.
          let lopNho = fireVolumetricCanvas, lopLon = fireVolumetricCanvas;
          if (typeof fCtx.filter === 'string') {
            const k = layout.fireBufW / (layout.paperW * layout.dpr);
            const lamMo = (c, r) => {
              if (c.width !== layout.fireBufW || c.height !== layout.fireBufH) {
                c.width = layout.fireBufW;
                c.height = layout.fireBufH;
              }
              const x = c.getContext('2d');
              x.clearRect(0, 0, c.width, c.height);
              x.filter = `blur(${(r * k).toFixed(2)}px)`;
              x.drawImage(fireVolumetricCanvas, 0, 0);
              x.filter = 'none';
              return c;
            };
            lopNho = lamMo(fireBlurNho, 2.2);
            lopLon = lamMo(fireBlurLon, 4.5);
          }
          fCtx.save();
          fCtx.imageSmoothingEnabled = true;
          fCtx.imageSmoothingQuality = 'high';
          fCtx.globalCompositeOperation = 'screen';
          fCtx.drawImage(lopNho, layout.paperX, layout.paperY, layout.paperW, layout.paperH);
          fCtx.globalCompositeOperation = 'lighter';
          fCtx.globalAlpha = 0.62 * state.fireIntensity;
          fCtx.drawImage(lopLon, layout.paperX, layout.paperY, layout.paperW, layout.paperH);
          fCtx.restore();
        }

        updateAndDrawParticles(fCtx, dt, nowSec);
        drawWaterStrokes(fCtx, nowSec);

        fCtx.restore();
      }

      function loop(nowMs) {
        renderSingleFrame(nowMs);
        if (state.phase !== 'SOLVED') {
          requestAnimationFrame(loop);
        } else {
          state.animationRunning = false;
        }
      }

      rebuildLayoutAndPaper();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
